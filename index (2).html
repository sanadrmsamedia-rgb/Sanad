<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سند | Sanad</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#faf6fb;--ink:#2b2140;--muted:#6a5f7d;--rose:#df5e89;--violet:#67439f;--vtext:#67439f;--tint:#fbe6ee;--line:#eadff0;--ok:#1f7a4d;--warn:#9a5b00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%}
a{color:var(--vtext)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.bar .sep{width:1px;height:30px;background:var(--line)}
.bar img{height:44px;width:auto}
.rmsa{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--vtext);font-size:15px;line-height:1.2}
.rmsa svg{flex:none}
.sp{flex:1}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--violet);color:#fff;text-decoration:none;display:inline-block;min-height:44px}
.btn.alt{background:transparent;color:var(--vtext);border:2px solid var(--violet)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:48px 0 40px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.25;margin:0 0 14px;font-weight:700}
.lead{color:var(--muted);font-size:18px;max-width:34em;margin:0 0 22px}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.logo-panel{background:var(--tint);border-radius:50% 50% 46% 54%/56% 52% 48% 44%;padding:44px 30px;display:grid;place-items:center;aspect-ratio:1/1}
.logo-panel img{width:88%}
.prog{height:12px;background:var(--tint);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .6s}
.tot{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin:8px 0 0;color:var(--muted);flex-wrap:wrap}
.tot b{color:var(--ink)}
section{padding:40px 0;border-top:1px solid var(--line)}
h2{font-size:28px;margin:0 0 6px}
.note{color:var(--muted);margin:0 0 20px}
.stu{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.stu h3{margin:0;font-size:19px}
.stu small{color:var(--muted);display:block}
.stu .prog{grid-column:1/-1}
.stu .amt{grid-column:1/-1;font-size:14px;color:var(--muted)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:640px}
.steps{display:flex;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:14px;font-weight:600;padding:8px 4px;border-bottom:4px solid var(--line);color:var(--muted)}
.steps li.on{border-color:var(--rose);color:var(--ink)}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:46px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;padding:9px 16px;border-radius:99px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--rose);background:var(--tint)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.kv span{color:var(--muted)}
.code{font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--vtext);direction:ltr;unicode-bidi:isolate}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.hide{display:none}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:600;border:1.5px solid currentColor}
.ok{color:var(--ok)}.wait{color:var(--warn)}
.tl{list-style:none;margin:14px 0 0;padding:0;border-inline-start:3px solid var(--rose)}
.tl li{padding:4px 16px 12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--muted);font-weight:600}
td.l{direction:ltr;unicode-bidi:isolate;text-align:start}
.err{color:#c0392b;font-weight:600;margin-top:10px}

footer{padding:28px 0 40px;color:var(--muted);border-top:1px solid var(--line);font-size:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:28px}.logo-panel{max-width:300px;margin:0 auto;order:-1}.bar img{height:36px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.prog>i{transition:none}}
.tier{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}.tier b{flex:none;min-width:9em;font-size:20px;color:var(--vtext)}.tier span{color:var(--ink)}.cover{color:var(--muted);margin:14px 0 0;min-height:1.7em}.stu .amt{text-align:end}.stu{grid-template-columns:1fr auto}@media (max-width:760px){.tier{flex-direction:column;gap:2px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cwrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.donut{width:230px;max-width:100%}.donut circle,.bars rect{cursor:pointer;transition:opacity .2s}
.dim{opacity:.3}
svg text{font-family:inherit}.cv{font-size:24px;font-weight:700;fill:var(--ink)}.cl{font-size:11px;fill:var(--muted)}
.bars{width:100%;max-width:520px}
.leg{display:grid;gap:4px;min-width:200px}
.leg button,.hb{font:inherit;color:var(--ink);background:none;border:0;display:flex;gap:10px;align-items:center;text-align:start;padding:6px 8px;border-radius:8px;cursor:pointer;min-height:40px;width:100%}
.leg button span{flex:1}.sw{width:14px;height:14px;border-radius:4px;flex:none}
.hbs{flex:1;min-width:260px}.hb span:first-child{width:8.5em;flex:none}.hb .tr{flex:1;height:14px;background:var(--tint);border-radius:99px;overflow:hidden;display:block}.hb .tr i{display:block;height:100%}.hb b{width:3.5em;text-align:end}
.tip{margin:14px 0 0;font-weight:600;min-height:1.7em;color:var(--vtext)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(30,15,45,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:19px}
.rmsa img{border-radius:50%}
@media (max-width:760px){.rmsa span{display:none}.bar{gap:8px}.bar .btn.sm{padding:6px 10px}}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}.chk input{width:auto;min-height:0;margin-top:6px;accent-color:var(--violet)}
.tier .btn{margin-inline-start:auto;flex:none}.tier.pl b{min-width:13em}
:root{--bg:#ffffff;--bg2:#f6f1fa;--card:#fff;--shadow:0 10px 32px rgba(103,67,159,.10);--line:#eee6f4}


body{font-size:17px}
header{background:var(--bg);border-bottom:0;box-shadow:0 1px 0 var(--line)}
.bar{height:68px}
.btn{border-radius:999px;padding:11px 24px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(103,67,159,.25)}
.btn.sm{padding:6px 16px}
.hero{padding:72px 0 48px;gap:56px}
h1{font-size:clamp(34px,5.4vw,58px);letter-spacing:-.02em;line-height:1.15}
.lead{font-size:19px;max-width:30em}
.logo-panel{border-radius:32px;aspect-ratio:auto;padding:56px 36px}
.logo-panel img{width:78%}
.prog{height:10px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.tot span{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;font-size:14px;color:var(--muted);line-height:1.4}
.tot b{font-size:22px;color:var(--ink)}
section{border-top:0;padding:60px 0}
h2{font-size:30px;letter-spacing:-.01em;margin-bottom:8px}
.note{max-width:42em}
.tier,.stu{background:var(--card);box-shadow:var(--shadow);border:0;border-radius:16px;padding:16px 20px;margin-bottom:10px}
.stu{padding:16px 20px}
.panel{background:var(--card);border:0;box-shadow:var(--shadow);border-radius:24px;padding:28px}
input,select{border-radius:12px;background:var(--bg2)}
input:focus,select:focus{border-color:var(--rose);outline:0;box-shadow:0 0 0 4px rgba(223,94,137,.2)}
.scroll,#cbox{background:var(--card);box-shadow:var(--shadow);border-radius:24px;padding:12px 20px}
#cbox{padding:24px}
dialog{border:0;border-radius:24px;box-shadow:0 24px 60px rgba(30,15,45,.35)}

.own{margin-top:18px}
@media (max-width:760px){.hero{padding:32px 0 24px;gap:24px}.logo-panel{padding:32px}.tot span{padding:10px 12px}.tot b{font-size:18px}.panel{padding:20px}section{padding:40px 0}}
.tabnav{display:flex;gap:6px;overflow-x:auto;padding:0 20px 10px;scrollbar-width:none}
.tabnav::-webkit-scrollbar{display:none}
.tabnav button{font:inherit;font-weight:600;font-size:15px;white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.tabnav button:hover{color:var(--ink)}
.tabnav button[aria-selected="true"],.tabnav button[aria-selected="true"]:hover{background:var(--violet);color:#fff}
.pane{display:none;padding:36px 0 56px}.pane.on{display:block}#home{padding:0}
.tier,.stu,.panel,.scroll,#cbox{border:1px solid var(--line)}
footer{border-top:1px solid var(--line);background:var(--bg)}
@media (max-width:760px){.bar{height:56px}.tabnav button{padding:6px 12px;min-height:36px;font-size:14px}}
:root{color-scheme:light;--bg:#ffffff}html,body{background:#ffffff}
</style>




</head>
