fq:[["Who runs Sanad?","Sanad is an initiative of the Ribat Medical Students Association at the National Ribat University. An organizing committee appointed by the association’s executive committee runs it, under the supervision of the executive committee’s deputy president. Each committee serves for one year."],

["Who can receive support?","Students of the Faculty of Medicine, National Ribat University, who are members of the association’s general assembly and are struggling to pay their fees."],
["How are cases chosen?","Each student fills in a standard form. The screening and documentation committee checks the information and ranks the cases using set criteria, such as family income, absence of a breadwinner, other financial obligations and the number of dependents. Urgent cases and students at risk of suspension are considered first."],

["How long does verification take?","We check each transfer by hand, usually within a few days. You will get an email receipt and your donation page will show Verified."],
["Can I give every month or every year?","Yes. Choose a plan in Give regularly. We email you a reminder with your code before each gift, and you can pause or cancel any time by replying to that email."],
